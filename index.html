<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Галерея-слайдер</title>
    
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.8.1/slick.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.8.1/slick-theme.min.css">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container my-5">
        <h2 class="text-center mb-4">Галерея изображений</h2>
        
        
        <div class="slider-container">
            <div class="image-slider">
                <div class="slide-item"><img src="pictures\38296bd07d08690e741800dd85e5b317.jpg" alt="Image 1" class="img-fluid"></div>
                <div class="slide-item"><img src="pictures\571828777.jpg" alt="Image 2" class="img-fluid"></div>
                <div class="slide-item"><img src="pictures\derevia_les_ozero_1453503_1920x1080.jpg" alt="Image 3" class="img-fluid"></div>
                <div class="slide-item"><img src="pictures\forest-river-sunset.jpeg" alt="Image 4" class="img-fluid"></div>
                <div class="slide-item"><img src="pictures\i (1).jpg" alt="Image 5" class="img-fluid"></div>
                <div class="slide-item"><img src="pictures\i.jpg" alt="Image 6" class="img-fluid"></div>
                <div class="slide-item"><img src="pictures\les_derevia_nebo_1485490_1920x1080.jpg" alt="Image 7" class="img-fluid"></div>
                <div class="slide-item"><img src="pictures\more_okean_gorizont_1429944_1920x1080.jpg" alt="Image 8" class="img-fluid"></div>
            </div>
            
            
            <button type="button" class="slick-prev custom-arrow btn btn-primary">&lt;</button>
            <button type="button" class="slick-next custom-arrow btn btn-primary">&gt;</button>
        </div>

        
        <div class="text-center mt-3">
            <span id="pager">Страница 1 из 3</span>
        </div>
    </div>

    
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.8.1/slick.min.js"></script>
    
    <script src="script.js"></script>
</body>
</html>
